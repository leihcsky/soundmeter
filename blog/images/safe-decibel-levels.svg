<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#f8fafc"/>

  <rect x="80" y="90" width="160" height="160" rx="16" fill="#dcfce7"/>
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" fill="#15803d" font-weight="bold">0-70</text>
  <text x="160" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#166534" font-weight="bold">dBA</text>
  <text x="160" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">Generally safe</text>

  <rect x="320" y="90" width="160" height="160" rx="16" fill="#fef9c3"/>
  <text x="400" y="150" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" fill="#a16207" font-weight="bold">70-85</text>
  <text x="400" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#854d0e" font-weight="bold">dBA</text>
  <text x="400" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">Limit time</text>

  <rect x="560" y="90" width="160" height="160" rx="16" fill="#fee2e2"/>
  <text x="640" y="150" font-family="Arial, sans-serif" font-size="34" text-anchor="middle" fill="#b91c1c" font-weight="bold">85+</text>
  <text x="640" y="185" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#991b1b" font-weight="bold">dBA</text>
  <text x="640" y="215" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">Protect hearing</text>

  <text x="400" y="320" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#334155" font-weight="bold">Safe Decibel Levels</text>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">Loudness x time = daily noise dose</text>
</svg>
