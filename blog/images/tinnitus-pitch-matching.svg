<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#0f172a"/>
  
  <!-- Wave pattern background subtle -->
  <path d="M 50 160 Q 150 80, 250 160 T 450 160 T 650 160 T 750 160" fill="none" stroke="#334155" stroke-width="2" opacity="0.4"/>
  <path d="M 50 160 Q 100 110, 150 160 T 250 160 T 350 160 T 450 160 T 550 160 T 650 160 T 750 160" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.8"/>
  
  <!-- Frequency Pillars -->
  <g transform="translate(80, 80)">
    <rect x="0" y="30" width="120" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">LOW HUM</text>
    <text x="60" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="extrabold" fill="#f8fafc" text-anchor="middle">250-1k</text>
    <text x="60" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="semibold" fill="#38bdf8" text-anchor="middle">Hz</text>
    <text x="60" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Rumble / Drone</text>
  </g>

  <g transform="translate(240, 60)">
    <rect x="0" y="20" width="140" height="160" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="35" width="100" height="20" rx="10" fill="#0284c7"/>
    <text x="70" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">COMMON RANGE</text>
    <text x="70" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="extrabold" fill="#38bdf8" text-anchor="middle">4k - 8k</text>
    <text x="70" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Hz</text>
    <text x="70" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">High Whistle / Ringing</text>
  </g>

  <g transform="translate(420, 70)">
    <rect x="0" y="30" width="130" height="140" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="65" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">ULTRA HIGH</text>
    <text x="65" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="extrabold" fill="#f8fafc" text-anchor="middle">10k-14k</text>
    <text x="65" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="semibold" fill="#38bdf8" text-anchor="middle">Hz</text>
    <text x="65" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Piercing Hiss</text>
  </g>

  <g transform="translate(590, 80)">
    <rect x="0" y="30" width="130" height="130" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="65" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">SOUND THERAPY</text>
    <text x="65" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="extrabold" fill="#f8fafc" text-anchor="middle">Masking</text>
    <text x="65" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="semibold" fill="#e2e8f0" text-anchor="middle">Pink / Notched</text>
    <text x="65" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Brain habituation</text>
  </g>

  <!-- Title -->
  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">Tinnitus Pitch Matching Guide</text>
  <text x="400" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Identify your ringing frequency with pure tones &amp; build safe acoustic masking</text>
</svg>
