<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f8fafc"/>

  <rect x="70" y="60" width="28" height="260" rx="6" fill="#e2e8f0"/>
  <rect x="70" y="220" width="28" height="100" fill="#86efac"/>
  <rect x="70" y="160" width="28" height="60" fill="#fde047"/>
  <rect x="70" y="100" width="28" height="60" fill="#fdba74"/>
  <rect x="70" y="60" width="28" height="40" rx="6" fill="#fca5a5"/>

  <text x="120" y="80" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">120+</text>
  <text x="120" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">100</text>
  <text x="120" y="190" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">85</text>
  <text x="120" y="250" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">70</text>
  <text x="120" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">40</text>

  <rect x="200" y="70" width="160" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="280" y="105" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Range</text>
  <text x="280" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">not a single dB</text>

  <rect x="380" y="70" width="160" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="460" y="105" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Distance</text>
  <text x="460" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">at ~1 m / arm</text>

  <rect x="560" y="70" width="160" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="640" y="105" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold">Weighting</text>
  <text x="640" y="130" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#64748b">usually dBA</text>

  <rect x="200" y="190" width="520" height="48" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="220" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1e40af">Whisper 25-30 - Talk 60-70 - Traffic ~85 - Concert 100-110+</text>

  <text x="400" y="290" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="bold">Decibel Chart</text>
  <text x="400" y="320" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle" fill="#64748b">Match your sound meter reading to everyday levels</text>
  <text x="400" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#94a3b8">Range - Distance - Peak vs average</text>
</svg>
